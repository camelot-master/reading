<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>학습 상세 및 본문 듣기</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 상단 헤더 */
        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .back-btn:active { background: rgba(255, 255, 255, 0.1); }
        .title-container { text-align: center; flex-grow: 1; }
        header h1 { font-size: 18px; font-weight: 700; }

        /* 콘텐츠 영역 */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .view.active { display: flex; }

        /* 단어 16개 그리드 */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .word-card {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            padding: 4px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
            word-break: break-all;
        }

        .word-card:active { transform: scale(0.95); }
        .word-card.meaning {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: #93c5fd;
        }
        .word-card.apple {
            font-size: 24px;
            cursor: default;
            opacity: 0.5;
        }

        /* 하단 메뉴 네비게이션 버튼 */
        .menu-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .action-btn:active { background: rgba(255, 255, 255, 0.1); }
        .action-btn.primary {
            background: var(--accent-blue);
            border: none;
        }
        .action-btn.primary:active { background: #2563eb; }

        /* 본문 전체보기 스타일 */
        .text-passage {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 17px;
            letter-spacing: 0.3px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .text-passage:active {
            border-color: var(--accent-blue);
        }
        .hint-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 한문장씩 읽기 스타일 */
        .sentence-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .eng-sentence { font-size: 19px; font-weight: 600; line-height: 1.5; }
        .kor-sentence { font-size: 16px; color: #a7f3d0; min-height: 24px; opacity: 0; transition: opacity 0.2s; }
        .kor-sentence.show { opacity: 1; }
        
        .counter {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="app-container" onclick="unlockAudioContext()">
    <header>
        <button class="back-btn" onclick="handleBack()">&#10094;</button>
        <div class="title-container">
            <h1 id="mainTitle">단어 미리보기</h1>
        </div>
        <div style="width: 36px;"></div>
    </header>

    <main>
        <!-- 화면 1: 단어장 메인 -->
        <div id="viewWords" class="view active">
            <div class="word-grid" id="wordGrid"></div>
            <div class="menu-box">
                <button class="action-btn" onclick="switchView('viewFullText')">📖 본문듣기</button>
                <button class="action-btn" onclick="switchView('viewSentence')">🔤 한문장씩 읽기</button>
            </div>
        </div>

        <!-- 화면 2: 본문전체보기 -->
        <div id="viewFullText" class="view">
            <div class="text-passage" onclick="speakAll()">
                <span id="fullPassageText"></span>
            </div>
            <p class="hint-text">💡 지문을 터치하면 전체 목소리가 오디오로 나옵니다.</p>
        </div>

        <!-- 화면 3: 한문장씩 보기 -->
        <div id="viewSentence" class="view">
            <div class="counter" id="sentenceCounter">1 / 7</div>
            <div class="sentence-card" onclick="speakCurrentSentence()">
                <div class="eng-sentence" id="engSentence"></div>
                <div class="kor-sentence" id="korSentence"></div>
            </div>
            <p class="hint-text">💡 문장을 터치하면 발음을 읽어주고 번역이 표시됩니다.</p>
            <div class="menu-box">
                <button class="action-btn primary" onclick="nextSentence()">다음 문장 ➔</button>
            </div>
        </div>
    </main>
</div>

<script>
    let audioUnlocked = false;

    function unlockAudioContext() {
        if (!audioUnlocked) {
            window.speechSynthesis.getVoices();
            const u = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(u);
            audioUnlocked = true;
        }
    }

    // 1. 제공받은 지문 데이터
    const rawPassage = "We live in the Knowledge Age. That means the ability to apply the right knowledge effectively is an important skill and the key factor in our success. We know our living environment changes all the time and becomes complicated as time goes on. That's why lifelong learning is a 'must' in the real-life context of the Knowledge Age. Knowledge makes us better people, allows us to make better decisions, and helps us in becoming more successful in our jobs. We cannot survive today with the knowledge that we learned long time ago. So it's important to learn something new each day just to go on and on.";

    // 지문에서 선별한 핵심 단어 16개
    const wordList = [
        { eng: "knowledge", kor: "지식" },
        { eng: "ability", kor: "능력" },
        { eng: "apply", kor: "적용하다" },
        { eng: "effectively", kor: "효과적으로" },
        { eng: "factor", kor: "요인" },
        { eng: "environment", kor: "환경" },
        { eng: "complicated", kor: "복잡한" },
        { eng: "lifelong", kor: "평생의" },
        { eng: "context", kor: "맥락" },
        { eng: "decision", kor: "결정" },
        { eng: "successful", kor: "성공적인" },
        { eng: "survive", kor: "살아남다" },
        { eng: "learned", kor: "배운" },
        { eng: "important", kor: "중요한" },
        { eng: "change", kor: "변화하다" },
        { eng: "skill", kor: "기술" }
    ];

    // 한 줄씩 읽기용 문장 분할 및 번역 데이터
    const sentenceList = [
        { eng: "We live in the Knowledge Age.", kor: "우리는 지식 정보화 시대에 살고 있습니다." },
        { eng: "That means the ability to apply the right knowledge effectively is an important skill and the key factor in our success.", kor: "이는 올바른 지식을 효과적으로 적용하는 능력이 중요한 기술이자 성공의 핵심 요인임을 의미합니다." },
        { eng: "We know our living environment changes all the time and becomes complicated as time goes on.", kor: "우리는 우리의 생활 환경이 항상 변화하고 시간이 지남에 따라 복잡해진다는 것을 알고 있습니다." },
        { eng: "That's why lifelong learning is a 'must' in the real-life context of the Knowledge Age.", kor: "이것이 바로 지식 정보화 시대의 실생활 맥락에서 평생학습이 '필수'인 이유입니다." },
        { eng: "Knowledge makes us better people, allows us to make better decisions, and helps us in becoming more successful in our jobs.", kor: "지식은 우리를 더 나은 사람으로 만들어 주고, 더 나은 결정을 내리게 하며, 직업에서 더 성공하도록 도와줍니다." },
        { eng: "We cannot survive today with the knowledge that we learned long time ago.", kor: "우리는 오래전에 배운 지식만으로는 오늘날 살아남을 수 없습니다." },
        { eng: "So it's important to learn something new each day just to go on and on.", kor: "따라서 계속해서 앞으로 나아가기 위해서는 매일 새로운 것을 배우는 것이 중요합니다." }
    ];

    let currentView = 'viewWords';
    let currentSentenceIdx = 0;

    document.addEventListener("DOMContentLoaded", () => {
        initWords();
        document.getElementById('fullPassageText').innerText = rawPassage;
    });

    function initWords() {
        const grid = document.getElementById('wordGrid');
        grid.innerHTML = '';

        let targetCount = 16;
        let finalWords = [...wordList];

        if (finalWords.length < 16) {
            if(finalWords.length > 12) {
                finalWords = finalWords.slice(0, 12);
            }
        }

        for (let i = 0; i < targetCount; i++) {
            const card = document.createElement('div');
            
            if (i < finalWords.length) {
                const item = finalWords[i];
                card.className = 'word-card';
                card.innerText = item.eng;
                card.dataset.eng = item.eng;
                card.dataset.kor = item.kor;
                card.dataset.state = 'eng';
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    unlockAudioContext();
                    toggleWord(card);
                };
            } else {
                card.className = 'word-card apple';
                card.innerText = '🍎';
            }
            grid.appendChild(card);
        }
    }

    function toggleWord(card) {
        const state = card.dataset.state;
        const eng = card.dataset.eng;
        const kor = card.dataset.kor;

        if (state === 'eng') {
            card.innerText = kor;
            card.classList.add('meaning');
            card.dataset.state = 'kor';
        } else {
            card.innerText = eng;
            card.classList.remove('meaning');
            card.dataset.state = 'eng';
        }
        
        speak(eng);
    }

    function speakAll() {
        speak(rawPassage);
    }

    function showSentence() {
        const current = sentenceList[currentSentenceIdx];
        document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${sentenceList.length}`;
        document.getElementById('engSentence').innerText = current.eng;
        
        const korElem = document.getElementById('korSentence');
        korElem.innerText = current.kor;
        korElem.classList.remove('show');
    }

    function speakCurrentSentence() {
        const current = sentenceList[currentSentenceIdx];
        speak(current.eng);
        
        const korElem = document.getElementById('korSentence');
        korElem.classList.add('show');
    }

    function nextSentence() {
        if (currentSentenceIdx < sentenceList.length - 1) {
            currentSentenceIdx++;
            showSentence();
        } else {
            alert("학습이 완료되었습니다. 첫 문장으로 이동합니다.");
            currentSentenceIdx = 0;
            showSentence();
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        
        window.speechSynthesis.speak(utterance);
    }

    function switchView(viewId) {
        currentView = viewId;
        document.getElementById('viewWords').classList.remove('active');
        document.getElementById('viewFullText').classList.remove('active');
        document.getElementById('viewSentence').classList.remove('active');

        document.getElementById(viewId).classList.add('active');

        const titleMap = {
            'viewWords': '단어 미리보기',
            'viewFullText': '본문 전체 듣기',
            'viewSentence': '한 문장씩 읽기'
        };
        document.getElementById('mainTitle').innerText = titleMap[viewId];

        if (viewId === 'viewSentence') {
            currentSentenceIdx = 0;
            showSentence();
        }
    }

    function handleBack() {
        if (currentView !== 'viewWords') {
            switchView('viewWords');
        } else {
            alert("인덱스 목록 화면으로 돌아갑니다.");
        }
    }
</script>

</body>
</html>
