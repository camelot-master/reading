<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>모바일 영어 학습 앱</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --color-beginner: #10b981;
            --color-intermediate: #f59e0b;
            --color-advanced: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 상단 헤더 */
        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            visibility: hidden; /* 처음에는 숨김 */
        }

        .back-btn:active { background: rgba(255, 255, 255, 0.1); }
        .title-container { text-align: center; flex-grow: 1; }
        header h1 { font-size: 18px; font-weight: 700; }
        .breadcrumb { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        /* 콘텐츠 영역 */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .view.active { display: flex; }

        /* Depth 1: 난이도 메인 버튼 */
        .card-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
        .card-btn.beginner::before { background-color: var(--color-beginner); }
        .card-btn.intermediate::before { background-color: var(--color-intermediate); }
        .card-btn.advanced::before { background-color: var(--color-advanced); }
        .card-btn:active { transform: scale(0.98); background: rgba(47, 63, 86, 0.8); }

        /* Depth 2: 단계 버튼 */
        .step-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
        .step-btn:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.08); }

        /* Depth 3: 30개 숫자 그리드 */
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .grid-item-btn {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .grid-item-btn:active { transform: scale(0.92); background: var(--accent-blue); border-color: var(--accent-blue); }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.1); color: var(--text-secondary); }

        /* Depth 4: 단어 16개 그리드 */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .word-card {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            padding: 4px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
            word-break: break-all;
        }

        .word-card:active { transform: scale(0.95); }
        .word-card.meaning {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: #93c5fd;
        }
        .word-card.apple {
            font-size: 24px;
            cursor: default;
            opacity: 0.5;
        }

        /* 하단 메뉴 네비게이션 버튼 */
        .menu-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .action-btn:active { background: rgba(255, 255, 255, 0.1); }
        .action-btn.primary {
            background: var(--accent-blue);
            border: none;
        }
        .action-btn.primary:active { background: #2563eb; }

        /* 본문 전체보기 스타일 */
        .text-passage {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 17px;
            letter-spacing: 0.3px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .text-passage:active {
            border-color: var(--accent-blue);
        }
        .hint-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 한문장씩 읽기 스타일 */
        .sentence-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .eng-sentence { font-size: 19px; font-weight: 600; line-height: 1.5; }
        .kor-sentence { font-size: 16px; color: #a7f3d0; min-height: 24px; opacity: 0; transition: opacity 0.2s; }
        .kor-sentence.show { opacity: 1; }
        
        .counter {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body onclick="unlockAudioContext()">

<div class="app-container">
    <header>
        <button class="back-btn" id="backBtn" onclick="handleBack()">&#10094;</button>
        <div class="title-container">
            <h1 id="mainTitle">난이도 선택</h1>
            <div class="breadcrumb" id="breadcrumb">홈</div>
        </div>
        <div style="width: 36px;"></div>
    </header>

    <main>
        <!-- Depth 1: 난이도 메인 화면 -->
        <div id="viewLevel" class="view active">
            <button class="card-btn beginner" onclick="selectLevel('초급')"><span>초급</span><span class="badge">3개 단계</span></button>
            <button class="card-btn intermediate" onclick="selectLevel('중급')"><span>중급</span><span class="badge">3개 단계</span></button>
            <button class="card-btn advanced" onclick="selectLevel('고급')"><span>고급</span><span class="badge">3개 단계</span></button>
        </div>

        <!-- Depth 2: 단계 선택 화면 -->
        <div id="viewStep" class="view">
            <button class="step-btn" onclick="selectStep('1단계')"><span>1단계</span><span class="badge">30개 항목</span></button>
            <button class="step-btn" onclick="selectStep('2단계')"><span>2단계</span><span class="badge">30개 항목</span></button>
            <button class="step-btn" onclick="selectStep('3단계')"><span>3단계</span><span class="badge">30개 항목</span></button>
        </div>

        <!-- Depth 3: 30개 버튼 목록 화면 -->
        <div id="viewItems" class="view">
            <div class="grid-container" id="gridContainer"></div>
        </div>

        <!-- Depth 4-1: 단어장 메인 (학습 상세) -->
        <div id="viewWords" class="view">
            <div class="word-grid" id="wordGrid"></div>
            <div class="menu-box">
                <button class="action-btn" onclick="switchSubView('viewFullText')">📖 본문듣기</button>
                <button class="action-btn" onclick="switchSubView('viewSentence')">🔤 한문장씩 읽기</button>
            </div>
        </div>

        <!-- Depth 4-2: 본문 전체보기 -->
        <div id="viewFullText" class="view">
            <div class="text-passage" onclick="speakAll()">
                <span id="fullPassageText"></span>
            </div>
            <p class="hint-text">💡 지문을 터치하면 전체 목소리가 오디오로 나옵니다.</p>
        </div>

        <!-- Depth 4-3: 한문장씩 보기 -->
        <div id="viewSentence" class="view">
            <div class="counter" id="sentenceCounter">1 / 5</div>
            <div class="sentence-card" onclick="speakCurrentSentence()">
                <div class="eng-sentence" id="engSentence"></div>
                <div class="kor-sentence" id="korSentence"></div>
            </div>
            <p class="hint-text">💡 문장을 터치하면 발음을 읽어주고 번역이 표시됩니다.</p>
            <div class="menu-box">
                <button class="action-btn primary" onclick="nextSentence()">다음 문장 ➔</button>
            </div>
        </div>
    </main>
</div>

<script>
    // 오디오 엔진 잠금 해제 상태 플래그
    let audioUnlocked = false;

    function unlockAudioContext() {
        if (!audioUnlocked) {
            window.speechSynthesis.getVoices();
            const u = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(u);
            audioUnlocked = true;
        }
    }

    // [학습 핵심 데이터베이스] 
    // 동일 구성을 유지하기 위해 주신 두 가지 지문을 고유 키 구조로 바인딩했습니다.
    const appDatabase = {
        // 1번 버튼 데이터 (고대 의학 지문)
        "초급_1단계_1": {
            rawPassage: "In ancient times, medical science was so dangerous that it was often safer to remain sick than it was to be treated. One of the most popular treatments was removing some of the patients' blood. This was for cutting the cause of a disease. Sometimes so much blood was lost that patients would grow weak and die. Another example of a harmful treatment was ‘sweating.’ A patient had to stay in a small hot room, covered in the heaviest clothing and blankets.",
            words: [
                { eng: "ancient", kor: "고대의" }, { eng: "medical", kor: "의학의" }, { eng: "science", kor: "과학" }, { eng: "dangerous", kor: "위험한" },
                { eng: "remain", kor: "남아있다" }, { eng: "treat", kor: "치료하다" }, { eng: "popular", kor: "인기있는" }, { eng: "remove", kor: "제거하다" },
                { eng: "patient", kor: "환자" }, { eng: "cause", kor: "원인" }, { eng: "disease", kor: "질병" }, { eng: "weak", kor: "약해진" },
                { eng: "harmful", kor: "해로운" }, { eng: "sweating", kor: "땀내기" }, { eng: "heavy", kor: "무거운" }, { eng: "blanket", kor: "담요" }
            ],
            sentences: [
                { eng: "In ancient times, medical science was so dangerous that it was often safer to remain sick than it was to be treated.", kor: "고대에는 의학이 너무 위험해서 치료를 받는 것보다 그냥 아픈 채로 있는 것이 더 안전한 경우가 많았습니다." },
                { eng: "One of the most popular treatments was removing some of the patients' blood.", kor: "가장 대중적인 치료법 중 하나는 환자의 혈액 일부를 뽑아내는 것이었습니다." },
                { eng: "This was for cutting the cause of a disease.", kor: "이것은 질병의 원인을 차단하기 위한 것이었습니다." },
                { eng: "Sometimes so much blood was lost that patients would grow weak and die.", kor: "때로는 피를 너무 많이 흘려서 환자들이 쇠약해져 사망하기도 했습니다." },
                { eng: "Another example of a harmful treatment was ‘sweating.’", kor: "해로운 치료법의 또 다른 예는 '땀내기'였습니다." },
                { eng: "A patient had to stay in a small hot room, covered in the heaviest clothing and blankets.", kor: "환자는 가장 무거운 옷과 담요를 뒤집어쓴 채 작고 뜨거운 방에 머물러야 했습니다." }
            ]
        },
        // 2번 버튼 데이터 (새로 주신 지식 시대 지문 - 원문 훼손 전혀 없음)
        "초급_1단계_2": {
            rawPassage: "We live in the Knowledge Age. That means the ability to apply the right knowledge effectively is an important skill and the key factor in our success. We know our living environment changes all the time and becomes complicated as time goes on. That's why lifelong learning is a 'must' in the real-life context of the Knowledge Age. Knowledge makes us better people, allows us to make better decisions, and helps us in becoming more successful in our jobs. We cannot survive today with the knowledge that we learned long time ago. So it's important to learn something new each day just to go on and on.",
            words: [
                { eng: "knowledge", kor: "지식" }, { eng: "ability", kor: "능력" }, { eng: "apply", kor: "적용하다" }, { eng: "effectively", kor: "효과적으로" },
                { eng: "important", kor: "중요한" }, { eng: "factor", kor: "요소" }, { eng: "success", kor: "성공" }, { eng: "environment", kor: "환경" },
                { eng: "complicated", kor: "복잡한" }, { eng: "lifelong", kor: "평생의" }, { eng: "context", kor: "맥락[상황]" }, { eng: "allow", kor: "가능하게 하다" },
                { eng: "decision", kor: "결정" }, { eng: "successful", kor: "성공적인" }, { eng: "survive", kor: "생존하다" }, { eng: "important", kor: "중요한" }
            ],
            sentences: [
                { eng: "We live in the Knowledge Age.", kor: "우리는 지식 시대에 살고 있습니다." },
                { eng: "That means the ability to apply the right knowledge effectively is an important skill and the key factor in our success.", kor: "그것은 올바른 지식을 효과적으로 적용하는 능력이 중요한 기술이자 우리 성공의 핵심 요소임을 의미합니다." },
                { eng: "We know our living environment changes all the time and becomes complicated as time goes on.", kor: "우리는 우리의 생활 환경이 항상 변하고 시간이 지남에 따라 복잡해진다는 것을 알고 있습니다." },
                { eng: "That's why lifelong learning is a 'must' in the real-life context of the Knowledge Age.", kor: "그것이 지식 시대의 현실적인 맥락에서 평생 학습이 '필수'인 이유입니다." },
                { eng: "Knowledge makes us better people, allows us to make better decisions, and helps us in becoming more successful in our jobs.", kor: "지식은 우리를 더 나은 사람으로 만들고, 더 나은 결정을 내리게 하며, 우리의 직업에서 더 성공적으로 되도록 도와줍니다." },
                { eng: "We cannot survive today with the knowledge that we learned long time ago.", kor: "우리는 오래전에 배웠던 지식만으로는 오늘날 살아남을 수 없습니다." },
                { eng: "So it's important to learn something new each day just to go on and on.", kor: "그러므로 계속해서 나아가기 위해 매일 새로운 것을 배우는 것이 중요합니다." }
            ]
        }
    };

    // 아직 지문이 등록되지 않은 나머지 3~30번 버튼 클릭용 예외 방지 안전장치 기본값
    const defaultData = {
        rawPassage: "This is a default study passage. Please add your texts into the database in the code.",
        words: [{ eng: "study", kor: "공부" }, { eng: "default", kor: "기본값" }],
        sentences: [{ eng: "This is a default study passage.", kor: "이것은 아직 등록되지 않은 번호의 기본 학습 지문입니다." }]
    };

    let currentLevel = '';
    let currentStep = '';
    let currentDepth = 1; // 1:난이도, 2:단계, 3:30개버튼, 4:단어프리뷰, 5:본문듣기, 6:한문장씩
    let activeData = null;
    let currentSentenceIdx = 0;

    const backBtn = document.getElementById('backBtn');
    const mainTitle = document.getElementById('mainTitle');
    const breadcrumb = document.getElementById('breadcrumb');
    const viewList = ['viewLevel', 'viewStep', 'viewItems', 'viewWords', 'viewFullText', 'viewSentence'].map(id => document.getElementById(id));

    // 네비게이션 트리거
    function selectLevel(level) { currentLevel = level; currentDepth = 2; updateUI(); }
    
    function selectStep(step) {
        currentStep = step; currentDepth = 3;
        const container = document.getElementById('gridContainer');
        container.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            const btn = document.createElement('button');
            btn.className = 'grid-item-btn';
            btn.innerText = i;
            btn.onclick = () => loadLesson(i);
            container.appendChild(btn);
        }
        updateUI();
    }

    // 파일 로딩 없이 메모리 안의 데이터를 즉시 바인딩하여 뷰 전환
    function loadLesson(num) {
        const key = `${currentLevel}_${currentStep}_${num}`;
        activeData = appDatabase[key] || defaultData;
        currentDepth = 4;
        initWords();
        document.getElementById('fullPassageText').innerText = activeData.rawPassage;
        updateUI();
    }

    // 16개 단어 그리드 배치 로직 (디자인 일체형)
    function initWords() {
        const grid = document.getElementById('wordGrid');
        grid.innerHTML = '';
        let list = [...activeData.words];
        if (list.length < 16 && list.length > 12) list = list.slice(0, 12);
        
        for (let i = 0; i < 16; i++) {
            const card = document.createElement('div');
            if (i < list.length) {
                const item = list[i];
                card.className = 'word-card'; card.innerText = item.eng;
                card.dataset.eng = item.eng; card.dataset.kor = item.kor; card.dataset.state = 'eng';
                card.onclick = (e) => {
                    e.stopPropagation();
                    unlockAudioContext();
                    toggleWord(card);
                };
            } else { card.className = 'word-card apple'; card.innerText = '🍎'; }
            grid.appendChild(card);
        }
    }

    function toggleWord(card) {
        if (card.dataset.state === 'eng') {
            card.innerText = card.dataset.kor; card.classList.add('meaning'); card.dataset.state = 'kor';
        } else {
            card.innerText = card.dataset.eng; card.classList.remove('meaning'); card.dataset.state = 'eng';
        }
        speak(card.dataset.eng);
    }

    // 하단 서브 뷰 제어
    function switchSubView(viewId) {
        if (viewId === 'viewFullText') currentDepth = 5;
        if (viewId === 'viewSentence') { currentDepth = 6; currentSentenceIdx = 0; showSentence(); }
        updateUI();
    }

    function showSentence() {
        const current = activeData.sentences[currentSentenceIdx];
        document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${activeData.sentences.length}`;
        document.getElementById('engSentence').innerText = current.eng;
        const korElem = document.getElementById('korSentence');
        korElem.innerText = current.kor; korElem.classList.remove('show');
    }

    function speakCurrentSentence() {
        speak(activeData.sentences[currentSentenceIdx].eng);
        document.getElementById('korSentence').classList.add('show');
    }

    function nextSentence() {
        if (currentSentenceIdx < activeData.sentences.length - 1) { currentSentenceIdx++; showSentence(); }
        else { alert("학습이 완료되었습니다. 첫 문장으로 이동합니다."); currentSentenceIdx = 0; showSentence(); }
    }

    function speakAll() { speak(activeData.rawPassage); }
    function speak(text) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.85; window.speechSynthesis.speak(u); }

    // 뒤로가기 제어기 (Depth 역순)
    function handleBack() {
        if (currentDepth === 6 || currentDepth === 5) currentDepth = 4;
        else if (currentDepth === 4) currentDepth = 3;
        else if (currentDepth === 3) currentDepth = 2;
        else if (currentDepth === 2) currentDepth = 1;
        updateUI();
    }

    // 화면 변환에 맞춰 타이틀 및 브레드크럼을 갱신하는 렌더러
    function updateUI() {
        viewList.forEach((v, i) => v.style.display = (i === currentDepth - 1) ? 'flex' : 'none');
        backBtn.style.visibility = (currentDepth === 1) ? 'hidden' : 'visible';
        
        if (currentDepth === 1) { mainTitle.innerText = '난이도 선택'; breadcrumb.innerText = '홈'; }
        else if (currentDepth === 2) { mainTitle.innerText = currentLevel; breadcrumb.innerText = `홈 > ${currentLevel}`; }
        else if (currentDepth === 3) { mainTitle.innerText = currentStep; breadcrumb.innerText = `홈 > ${currentLevel} > ${currentStep}`; }
        else if (currentDepth === 4) { mainTitle.innerText = '단어 미리보기'; breadcrumb.innerText = `${currentLevel} > ${currentStep} > 학습`; }
        else if (currentDepth === 5) { mainTitle.innerText = '본문 전체 듣기'; }
        else if (currentDepth === 6) { mainTitle.innerText = '한 문장씩 읽기'; }
    }
</script>
</body>
</html>
