<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>학습 상세 및 본문 듣기</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 상단 헤더 */
        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .back-btn:active { background: rgba(255, 255, 255, 0.1); }
        .title-container { text-align: center; flex-grow: 1; }
        header h1 { font-size: 18px; font-weight: 700; }

        /* 콘텐츠 영역 */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .view.active { display: flex; }

        /* 단어 16개 그리드 */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .word-card {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            padding: 4px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
            word-break: break-all;
        }

        .word-card:active { transform: scale(0.95); }
        .word-card.meaning {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: #93c5fd;
        }
        .word-card.apple {
            font-size: 24px;
            cursor: default;
            opacity: 0.5;
        }

        /* 하단 메뉴 네비게이션 버튼 */
        .menu-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .action-btn:active { background: rgba(255, 255, 255, 0.1); }
        .action-btn.primary {
            background: var(--accent-blue);
            border: none;
        }
        .action-btn.primary:active { background: #2563eb; }

        /* 본문 전체보기 스타일 */
        .text-passage {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            line-height: 1.8;
            font-size: 17px;
            letter-spacing: 0.3px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .text-passage:active {
            border-color: var(--accent-blue);
        }
        .hint-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 한문장씩 읽기 스타일 */
        .sentence-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .eng-sentence { font-size: 19px; font-weight: 600; line-height: 1.5; }
        .kor-sentence { font-size: 16px; color: #a7f3d0; min-height: 24px; opacity: 0; transition: opacity 0.2s; }
        .kor-sentence.show { opacity: 1; }
        
        .counter {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="app-container" onclick="unlockAudioContext()">
    <header>
        <button class="back-btn" onclick="handleBack()">&#10094;</button>
        <div class="title-container">
            <h1 id="mainTitle">단어 미리보기</h1>
        </div>
        <div style="width: 36px;"></div>
    </header>

    <main>
        <!-- 화면 1: 단어장 메인 -->
        <div id="viewWords" class="view active">
            <div class="word-grid" id="wordGrid"></div>
            <div class="menu-box">
                <button class="action-btn" onclick="switchView('viewFullText')">📖 본문듣기</button>
                <button class="action-btn" onclick="switchView('viewSentence')">🔤 한문장씩 읽기</button>
            </div>
        </div>

        <!-- 화면 2: 본문전체보기 -->
        <div id="viewFullText" class="view">
            <div class="text-passage" onclick="speakAll()">
                <span id="fullPassageText"></span>
            </div>
            <p class="hint-text">💡 지문을 터치하면 전체 목소리가 오디오로 나옵니다.</p>
        </div>

        <!-- 화면 3: 한문장씩 보기 -->
        <div id="viewSentence" class="view">
            <div class="counter" id="sentenceCounter">1 / 5</div>
            <div class="sentence-card" onclick="speakCurrentSentence()">
                <div class="eng-sentence" id="engSentence"></div>
                <div class="kor-sentence" id="korSentence"></div>
            </div>
            <p class="hint-text">💡 문장을 터치하면 발음을 읽어주고 번역이 표시됩니다.</p>
            <div class="menu-box">
                <button class="action-btn primary" onclick="nextSentence()">다음 문장 ➔</button>
            </div>
        </div>
    </main>
</div>

<script>
    // 오디오 엔진 잠금 해제 상태 플래그
    let audioUnlocked = false;

    // 브라우저 모바일 오디오 제한을 해제하는 중요 안전장치 함수
    function unlockAudioContext() {
        if (!audioUnlocked) {
            window.speechSynthesis.getVoices(); // 보이스 리스트 초기 로드 트리거
            const u = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(u); // 빈 무음 소리 출력으로 모바일 락 해제
            audioUnlocked = true;
        }
    }

    // 1. 제공받은 영어 지문 데이터
    const rawPassage = "In ancient times, medical science was so dangerous that it was often safer to remain sick than it was to be treated. One of the most popular treatments was removing some of the patients' blood. This was for cutting the cause of a disease. Sometimes so much blood was lost that patients would grow weak and die. Another example of a harmful treatment was ‘sweating.’ A patient had to stay in a small hot room, covered in the heaviest clothing and blankets.";

    // 지문에서 선별한 핵심 단어 16개 세팅
    const wordList = [
        { eng: "ancient", kor: "고대의" },
        { eng: "medical", kor: "의학의" },
        { eng: "science", kor: "과학" },
        { eng: "dangerous", kor: "위험한" },
        { eng: "remain", kor: "남아있다" },
        { eng: "treat", kor: "치료하다" },
        { eng: "popular", kor: "인기있는" },
        { eng: "remove", kor: "제거하다" },
        { eng: "patient", kor: "환자" },
        { eng: "cause", kor: "원인" },
        { eng: "disease", kor: "질병" },
        { eng: "weak", kor: "약해진" },
        { eng: "harmful", kor: "해로운" },
        { eng: "sweating", kor: "땀내기" },
        { eng: "heavy", kor: "무거운" },
        { eng: "blanket", kor: "담요" }
    ];

    // 한 줄씩 읽기용 지문 분할 데이터
    const sentenceList = [
        { eng: "In ancient times, medical science was so dangerous that it was often safer to remain sick than it was to be treated.", kor: "고대에는 의학이 너무 위험해서 치료를 받는 것보다 그냥 아픈 채로 있는 것이 더 안전한 경우가 많았습니다." },
        { eng: "One of the most popular treatments was removing some of the patients' blood.", kor: "가장 대중적인 치료법 중 하나는 환자의 혈액 일부를 뽑아내는 것이었습니다." },
        { eng: "This was for cutting the cause of a disease.", kor: "이것은 질병의 원인을 차단하기 위한 것이었습니다." },
        { eng: "Sometimes so much blood was lost that patients would grow weak and die.", kor: "때로는 피를 너무 많이 흘려서 환자들이 쇠약해져 사망하기도 했습니다." },
        { eng: "Another example of a harmful treatment was ‘sweating.’", kor: "해로운 치료법의 또 다른 예는 '땀내기'였습니다." },
        { eng: "A patient had to stay in a small hot room, covered in the heaviest clothing and blankets.", kor: "환자는 가장 무거운 옷과 담요를 뒤집어쓴 채 작고 뜨거운 방에 머물러야 했습니다." }
    ];

    let currentView = 'viewWords';
    let currentSentenceIdx = 0;

    document.addEventListener("DOMContentLoaded", () => {
        initWords();
        document.getElementById('fullPassageText').innerText = rawPassage;
    });

    // 16개 단어 그리드 배치 로직 (부족 시 12개 자르고 사과 채우는 안전 규칙 포함)
    function initWords() {
        const grid = document.getElementById('wordGrid');
        grid.innerHTML = '';

        let targetCount = 16;
        let finalWords = [...wordList];

        if (finalWords.length < 16) {
            if(finalWords.length > 12) {
                finalWords = finalWords.slice(0, 12);
            }
        }

        for (let i = 0; i < targetCount; i++) {
            const card = document.createElement('div');
            
            if (i < finalWords.length) {
                const item = finalWords[i];
                card.className = 'word-card';
                card.innerText = item.eng;
                card.dataset.eng = item.eng;
                card.dataset.kor = item.kor;
                card.dataset.state = 'eng';
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    unlockAudioContext();
                    toggleWord(card);
                };
            } else {
                card.className = 'word-card apple';
                card.innerText = '🍎';
            }
            grid.appendChild(card);
        }
    }

    function toggleWord(card) {
        const state = card.dataset.state;
        const eng = card.dataset.eng;
        const kor = card.dataset.kor;

        if (state === 'eng') {
            card.innerText = kor;
            card.classList.add('meaning');
            card.dataset.state = 'kor';
        } else {
            card.innerText = eng;
            card.classList.remove('meaning');
            card.dataset.state = 'eng';
        }
        
        speak(eng);
    }

    function speakAll() {
        speak(rawPassage);
    }

    function showSentence() {
        const current = sentenceList[currentSentenceIdx];
        document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${sentenceList.length}`;
        document.getElementById('engSentence').innerText = current.eng;
        
        const korElem = document.getElementById('korSentence');
        korElem.innerText = current.kor;
        korElem.classList.remove('show');
    }

    function speakCurrentSentence() {
        const current = sentenceList[currentSentenceIdx];
        speak(current.eng);
        
        const korElem = document.getElementById('korSentence');
        korElem.classList.add('show');
    }

    function nextSentence() {
        if (currentSentenceIdx < sentenceList.length - 1) {
            currentSentenceIdx++;
            showSentence();
        } else {
            alert("학습이 완료되었습니다. 첫 문장으로 이동합니다.");
            currentSentenceIdx = 0;
            showSentence();
        }
    }

    // 소리 출력 모듈 (네이티브 TTS 사용)
    function speak(text) {
        // 이전 재생을 즉시 정지시켜 음성이 겹치거나 딜레이되는 현상 예방
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85; // 다소 빠를 수 있는 모바일 가독성을 위해 자상한 속도로 조정
        
        window.speechSynthesis.speak(utterance);
    }

    function switchView(viewId) {
        currentView = viewId;
        document.getElementById('viewWords').classList.remove('active');
        document.getElementById('viewFullText').classList.remove('active');
        document.getElementById('viewSentence').classList.remove('active');

        document.getElementById(viewId).classList.add('active');

        const titleMap = {
            'viewWords': '단어 미리보기',
            'viewFullText': '본문 전체 듣기',
            'viewSentence': '한 문장씩 읽기'
        };
        document.getElementById('mainTitle').innerText = titleMap[viewId];

        if (viewId === 'viewSentence') {
            currentSentenceIdx = 0;
            showSentence();
        }
    }

    function handleBack() {
        if (currentView !== 'viewWords') {
            switchView('viewWords');
        } else {
            alert("인덱스 목록 화면으로 돌아갑니다.");
        }
    }
</script>

</body>
</html>
