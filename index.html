<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 코스 선택</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            min-height: 40px;
        }
        .back-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .back-btn:active { background: #334155; }
        h1 {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
        }
        .breadcrumb {
            background: rgba(30, 41, 59, 0.5);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 20px;
            display: none;
        }
        .grid-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .grid-lessons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .btn-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-card:active {
            background: #2563eb;
            transform: scale(0.98);
        }
        .btn-lesson {
            padding: 14px 0;
            font-size: 15px;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.9);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button id="backBtn" class="back-btn" onclick="goBack()">❮ 이전</button>
            <h1 id="titleText">난이도를 선택하세요</h1>
            <div style="width: 50px;" id="spacer"></div>
        </header>

        <div id="breadcrumb" class="breadcrumb"></div>
        <div id="contentArea" class="grid-list"></div>
    </div>

    <script>
        const levels = [
            { folder: '초급', name: '초급', icon: '🌱' },
            { folder: '중급', name: '중급', icon: '🌿' },
            { folder: '고급', name: '고급', icon: '🌳' }
        ];

        const stages = [
            { folder: '1단계', name: '1단계' },
            { folder: '2단계', name: '2단계' },
            { folder: '3단계', name: '3단계' }
        ];

        const TOTAL_LESSONS = 20;

        let currentLevel = null;
        let currentStage = null;

        document.addEventListener("DOMContentLoaded", renderLevels);

        function renderLevels() {
            currentLevel = null;
            currentStage = null;

            updateHeader('난이도를 선택하세요', false);
            hideBreadcrumb();
            
            const area = document.getElementById('contentArea');
            area.className = 'grid-list';
            area.innerHTML = levels.map(lvl => `
                <div class="btn-card" onclick="selectLevel('${lvl.folder}', '${lvl.name}')">
                    ${lvl.icon} ${lvl.name}
                </div>
            `).join('');
        }

        function selectLevel(folder, name) {
            currentLevel = { folder, name };
            renderStages();
        }

        function renderStages() {
            currentStage = null;

            updateHeader(`${currentLevel.name} > 단계를 선택하세요`, true);
            showBreadcrumb(`${currentLevel.name}`);

            const area = document.getElementById('contentArea');
            area.className = 'grid-list';
            area.innerHTML = stages.map(stg => `
                <div class="btn-card" onclick="selectStage('${stg.folder}', '${stg.name}')">
                    ${stg.name}
                </div>
            `).join('');
        }

        function selectStage(folder, name) {
            currentStage = { folder, name };
            renderLessons();
        }

        function renderLessons() {
            updateHeader(`${currentLevel.name} ${currentStage.name}`, true);
            showBreadcrumb(`${currentLevel.name} > ${currentStage.name}`);

            const area = document.getElementById('contentArea');
            area.className = 'grid-lessons';

            let html = '';
            for (let i = 1; i <= TOTAL_LESSONS; i++) {
                const targetUrl = `${currentLevel.folder}/${currentStage.folder}/${i}.html`;
                html += `
                    <a href="${targetUrl}" class="btn-card btn-lesson">
                        ${i}
                    </a>
                `;
            }
            area.innerHTML = html;
        }

        function goBack() {
            if (currentStage) {
                renderStages();
            } else if (currentLevel) {
                renderLevels();
            }
        }

        function updateHeader(title, showBack) {
            document.getElementById('titleText').innerText = title;
            document.getElementById('backBtn').style.display = showBack ? 'block' : 'none';
        }

        function showBreadcrumb(text) {
            const bc = document.getElementById('breadcrumb');
            bc.style.display = 'block';
            bc.innerText = `현재 위치: ${text}`;
        }

        function hideBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            bc.style.display = 'none';
        }
    </script>
</body>
</html>
