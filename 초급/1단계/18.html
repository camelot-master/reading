<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15강 학습하기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        h1 { font-size: 18px; font-weight: 700; }
        
        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        nav button {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        nav button.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
        }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* 단어 16개 세로 1열 정렬 */
        #wordGrid {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px;
            width: 100%;
        }
        .word-card {
            width: 100%;
            padding: 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .word-card.meaning {
            background: #2563eb;
        }

        .passage-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 16px;
            white-space: pre-line;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .sentence-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        .eng-text { font-size: 17px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
        .kor-text { font-size: 14px; color: #94a3b8; display: none; }
        .kor-text.show { display: block; }
        .sentence-controls { display: flex; gap: 8px; }
        .sentence-controls button { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="handleBack()">❮ 메인으로</button>
            <h1 id="mainTitle">15강 학습</h1>
            <div style="width: 50px;"></div>
        </header>

        <nav>
            <button id="btnWords" class="active" onclick="switchView('viewWords')">단어장</button>
            <button id="btnFullText" onclick="switchView('viewFullText')">전체본문</button>
            <button id="btnSentence" onclick="switchView('viewSentence')">문장학습</button>
        </nav>

        <!-- 1. 단어장 (세로 1열) -->
        <div id="viewWords" class="view-panel active">
            <div id="wordGrid"></div>
        </div>

        <!-- 2. 전체 본문 -->
        <div id="viewFullText" class="view-panel">
            <div class="passage-box" id="fullPassageText"></div>
            <button class="btn-action" onclick="speakAll()">🔊 전체 오디오 듣기</button>
        </div>

        <!-- 3. 한 문장씩 읽기 -->
        <div id="viewSentence" class="view-panel">
            <div style="text-align: right; font-size: 12px; color: #94a3b8; margin-bottom: 6px;" id="sentenceCounter">1 / 1</div>
            <div class="sentence-box">
                <div class="eng-text" id="engSentence"></div>
                <div class="kor-text" id="korSentence"></div>
            </div>
            <div class="sentence-controls">
                <button class="btn-action" style="background: #0284c7;" onclick="speakCurrentSentence()">🔊 읽기 / 해석</button>
                <button class="btn-action" onclick="nextSentence()">다음 문장 ❯</button>
            </div>
        </div>
    </div>

    <script>
        // 지문 기반 핵심 단어 16개 (세로 정렬용)
        const wordList = [
            { eng: "1. hope", kor: "희망, 바라는 것" },
            { eng: "2. play a role", kor: "역할을 하다" },
            { eng: "3. success", kor: "성공" },
            { eng: "4. high hope", kor: "높은 희망, 큰 기대를 갖다" },
            { eng: "5. be willing to", kor: "기꺼이 ~하다" },
            { eng: "6. turn to", kor: "~에게 의지하다, 조언을 구하다" },
            { eng: "7. advice", kor: "조언, 충고" },
            { eng: "8. achieve", kor: "달성하다, 이루다" },
            { eng: "9. goal", kor: "목표" },
            { eng: "10. succeed", kor: "성공하다" },
            { eng: "11. bad situation", kor: "나쁜 상황, 어려운 상황" },
            { eng: "12. as time goes by", kor: "시간이 흐름에 따라" },
            { eng: "13. disappear", kor: "사라지다" },
            { eng: "14. aim for", kor: "~을 목표로 하다" },
            { eng: "15. consistently", kor: "지속적으로, 끊임없이" },
            { eng: "16. do one's best", kor: "최선을 다하다" }
        ];

        // 전체 본문
        const rawPassage = `Hope is said to play a very important role in a person's success. Do you think you have high hopes? Maybe yes or no. You can check by reading the following information. People with high levels of hope are willing to turn to friends for advice on how to achieve their goals. They tell themselves they will succeed. Even in a bad situation, they tell themselves things will get better as time goes by. If hope for one goal disappears, they aim for another. Consistently, they set the goals and try to do their best to achieve their dreams.`;

        // 문장별 분할 및 한국어 해석
        const sentenceList = [
            { eng: "Hope is said to play a very important role in a person's success.", kor: "희망은 한 사람의 성공에 매우 중요한 역할을 한다고 합니다." },
            { eng: "Do you think you have high hopes?", kor: "여러분은 스스로가 높은 수준의 희망을 가지고 있다고 생각하나요?" },
            { eng: "Maybe yes or no.", kor: "아마 그럴 수도 있고, 그렇지 않을 수도 있습니다." },
            { eng: "You can check by reading the following information.", kor: "다음 정보를 읽어보고 확인해 볼 수 있습니다." },
            { eng: "People with high levels of hope are willing to turn to friends for advice on how to achieve their goals.", kor: "높은 희망을 가진 사람들은 자신의 목표를 달성하는 방법에 대해 기꺼이 친구들에게 조언을 구합니다." },
            { eng: "They tell themselves they will succeed.", kor: "그들은 자신이 성공할 것이라고 스스로에게 말합니다." },
            { eng: "Even in a bad situation, they tell themselves things will get better as time goes by.", kor: "좋지 않은 상황에서도 그들은 시간이 지남에 따라 상황이 나아질 것이라고 스스로에게 다짐합니다." },
            { eng: "If hope for one goal disappears, they aim for another.", kor: "한 가지 목표에 대한 희망이 사라지면, 그들은 다른 목표를 향해 나아갑니다." },
            { eng: "Consistently, they set the goals and try to do their best to achieve their dreams.", kor: "그들은 지속적으로 목표를 설정하고 자신의 꿈을 이루기 위해 최선을 다합니다." }
        ];

        let currentSentenceIdx = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initWords();
            document.getElementById('fullPassageText').innerText = rawPassage;
        });

        function initWords() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            wordList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerText = item.eng;
                card.dataset.eng = item.eng;
                card.dataset.kor = item.kor;
                card.dataset.state = 'eng';
                
                card.onclick = () => toggleWord(card);
                grid.appendChild(card);
            });
        }

        function toggleWord(card) {
            if (card.dataset.state === 'eng') {
                card.innerText = card.dataset.kor;
                card.classList.add('meaning');
                card.dataset.state = 'kor';
            } else {
                card.innerText = card.dataset.eng;
                card.classList.remove('meaning');
                card.dataset.state = 'eng';
            }
            speak(card.dataset.eng.replace(/^[0-9]+\.\s*/, ''));
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        function speakAll() { speak(rawPassage); }

        function showSentence() {
            const current = sentenceList[currentSentenceIdx];
            document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${sentenceList.length}`;
            document.getElementById('engSentence').innerText = current.eng;
            document.getElementById('korSentence').innerText = current.kor;
            document.getElementById('korSentence').classList.remove('show');
        }

        function speakCurrentSentence() {
            speak(sentenceList[currentSentenceIdx].eng);
            document.getElementById('korSentence').classList.add('show');
        }

        function nextSentence() {
            if (currentSentenceIdx < sentenceList.length - 1) {
                currentSentenceIdx++;
            } else {
                alert("마지막 문장입니다. 첫 문장으로 이동합니다.");
                currentSentenceIdx = 0;
            }
            showSentence();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');

            if (viewId === 'viewWords') document.getElementById('btnWords').classList.add('active');
            if (viewId === 'viewFullText') document.getElementById('btnFullText').classList.add('active');
            if (viewId === 'viewSentence') {
                document.getElementById('btnSentence').classList.add('active');
                currentSentenceIdx = 0;
                showSentence();
            }
        }

        function handleBack() {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
