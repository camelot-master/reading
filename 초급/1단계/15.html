<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12강 학습하기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        h1 { font-size: 18px; font-weight: 700; }
        
        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        nav button {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        nav button.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
        }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* 단어 16개 세로 1열 정렬 */
        #wordGrid {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px;
            width: 100%;
        }
        .word-card {
            width: 100%;
            padding: 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .word-card.meaning {
            background: #2563eb;
        }

        .passage-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 16px;
            white-space: pre-line;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .sentence-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        .eng-text { font-size: 17px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
        .kor-text { font-size: 14px; color: #94a3b8; display: none; }
        .kor-text.show { display: block; }
        .sentence-controls { display: flex; gap: 8px; }
        .sentence-controls button { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="handleBack()">❮ 메인으로</button>
            <h1 id="mainTitle">12강 학습</h1>
            <div style="width: 50px;"></div>
        </header>

        <nav>
            <button id="btnWords" class="active" onclick="switchView('viewWords')">단어장</button>
            <button id="btnFullText" onclick="switchView('viewFullText')">전체본문</button>
            <button id="btnSentence" onclick="switchView('viewSentence')">문장학습</button>
        </nav>

        <!-- 1. 단어장 (세로 1열) -->
        <div id="viewWords" class="view-panel active">
            <div id="wordGrid"></div>
        </div>

        <!-- 2. 전체 본문 -->
        <div id="viewFullText" class="view-panel">
            <div class="passage-box" id="fullPassageText"></div>
            <button class="btn-action" onclick="speakAll()">🔊 전체 오디오 듣기</button>
        </div>

        <!-- 3. 한 문장씩 읽기 -->
        <div id="viewSentence" class="view-panel">
            <div style="text-align: right; font-size: 12px; color: #94a3b8; margin-bottom: 6px;" id="sentenceCounter">1 / 1</div>
            <div class="sentence-box">
                <div class="eng-text" id="engSentence"></div>
                <div class="kor-text" id="korSentence"></div>
            </div>
            <div class="sentence-controls">
                <button class="btn-action" style="background: #0284c7;" onclick="speakCurrentSentence()">🔊 읽기 / 해석</button>
                <button class="btn-action" onclick="nextSentence()">다음 문장 ❯</button>
            </div>
        </div>
    </div>

    <script>
        // 지문 기반 핵심 단어 16개 (세로 정렬용)
        const wordList = [
            { eng: "1. worry", kor: "걱정하다, 염려하다" },
            { eng: "2. handheld", kor: "휴대용의" },
            { eng: "3. notice", kor: "알아차리다, 주목하다" },
            { eng: "4. patient", kor: "환자" },
            { eng: "5. experience", kor: "경험하다, 겪다" },
            { eng: "6. pain", kor: "통증, 고통" },
            { eng: "7. concentrate on", kor: "~에 집중하다" },
            { eng: "8. hospital visit", kor: "병원 방문, 병원 진료" },
            { eng: "9. easier", kor: "더 수월한, 더 편한" },
            { eng: "10. thanks to", kor: "~덕분에" },
            { eng: "11. program", kor: "프로그램, 제도" },
            { eng: "12. allow", kor: "허용하다, 가능하게 하다" },
            { eng: "13. adventure", kor: "모험" },
            { eng: "14. bring together", kor: "~을 하나로 모으다, 맺어주다" },
            { eng: "15. isolated", kor: "고립된, 외로운" },
            { eng: "16. illness", kor: "병, 질환" }
        ];

        // 전체 본문
        const rawPassage = `People worry that spending too much time playing video games isn't good for a child's health. But some doctors have noticed that kids who bring their handheld game players to the hospital seem less worried about being there. These patients also seem to experience less pain when they are concentrating on the games. For example, at the Johns Hopkins Children's Center in Baltimore, young patients are finding hospital visits easier, thanks to a program. The program allows kids to play online sports, racing, and adventure games with each other. It brings together kids who feel they are isolated by their illnesses, and lets them know they are not alone.`;

        // 문장별 분할 및 한국어 해석
        const sentenceList = [
            { eng: "People worry that spending too much time playing video games isn't good for a child's health.", kor: "사람들은 비디오 게임을 하는 데 너무 많은 시간을 보내는 것이 아이의 건강에 좋지 않다고 걱정합니다." },
            { eng: "But some doctors have noticed that kids who bring their handheld game players to the hospital seem less worried about being there.", kor: "하지만 일부 의사들은 병원에 휴대용 게임기를 가져오는 아이들이 그곳에 있는 것에 대해 걱정을 덜 하는 것 같다는 점을 알아챘습니다." },
            { eng: "These patients also seem to experience less pain when they are concentrating on the games.", kor: "이 환자들은 또한 게임에 집중하고 있을 때 통증을 덜 느끼는 것으로 보입니다." },
            { eng: "For example, at the Johns Hopkins Children's Center in Baltimore, young patients are finding hospital visits easier, thanks to a program.", kor: "예를 들어 볼티모어의 존스 홉킨스 어린이 센터에서는 한 프로그램 덕분에 어린 환자들이 병원 방문을 한결 수월하게 느끼고 있습니다." },
            { eng: "The program allows kids to play online sports, racing, and adventure games with each other.", kor: "이 프로그램은 아이들이 서로 온라인 스포츠, 레이싱, 모험 게임을 즐길 수 있도록 지원합니다." },
            { eng: "It brings together kids who feel they are isolated by their illnesses, and lets them know they are not alone.", kor: "이 프로그램은 질병으로 인해 고립감을 느끼는 아이들을 서로 연결해 주고, 자신이 혼자가 아니라는 사실을 알게 해 줍니다." }
        ];

        let currentSentenceIdx = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initWords();
            document.getElementById('fullPassageText').innerText = rawPassage;
        });

        function initWords() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            wordList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerText = item.eng;
                card.dataset.eng = item.eng;
                card.dataset.kor = item.kor;
                card.dataset.state = 'eng';
                
                card.onclick = () => toggleWord(card);
                grid.appendChild(card);
            });
        }

        function toggleWord(card) {
            if (card.dataset.state === 'eng') {
                card.innerText = card.dataset.kor;
                card.classList.add('meaning');
                card.dataset.state = 'kor';
            } else {
                card.innerText = card.dataset.eng;
                card.classList.remove('meaning');
                card.dataset.state = 'eng';
            }
            speak(card.dataset.eng.replace(/^[0-9]+\.\s*/, ''));
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        function speakAll() { speak(rawPassage); }

        function showSentence() {
            const current = sentenceList[currentSentenceIdx];
            document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${sentenceList.length}`;
            document.getElementById('engSentence').innerText = current.eng;
            document.getElementById('korSentence').innerText = current.kor;
            document.getElementById('korSentence').classList.remove('show');
        }

        function speakCurrentSentence() {
            speak(sentenceList[currentSentenceIdx].eng);
            document.getElementById('korSentence').classList.add('show');
        }

        function nextSentence() {
            if (currentSentenceIdx < sentenceList.length - 1) {
                currentSentenceIdx++;
            } else {
                alert("마지막 문장입니다. 첫 문장으로 이동합니다.");
                currentSentenceIdx = 0;
            }
            showSentence();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');

            if (viewId === 'viewWords') document.getElementById('btnWords').classList.add('active');
            if (viewId === 'viewFullText') document.getElementById('btnFullText').classList.add('active');
            if (viewId === 'viewSentence') {
                document.getElementById('btnSentence').classList.add('active');
                currentSentenceIdx = 0;
                showSentence();
            }
        }

        function handleBack() {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
