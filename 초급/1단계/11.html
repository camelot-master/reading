<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8강 학습하기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        h1 { font-size: 18px; font-weight: 700; }
        
        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        nav button {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        nav button.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
        }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* 단어 16개 세로 1열 정렬 */
        #wordGrid {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px;
            width: 100%;
        }
        .word-card {
            width: 100%;
            padding: 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .word-card.meaning {
            background: #2563eb;
        }

        .passage-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 16px;
            white-space: pre-line;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .sentence-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        .eng-text { font-size: 17px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
        .kor-text { font-size: 14px; color: #94a3b8; display: none; }
        .kor-text.show { display: block; }
        .sentence-controls { display: flex; gap: 8px; }
        .sentence-controls button { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="handleBack()">❮ 메인으로</button>
            <h1 id="mainTitle">8강 학습</h1>
            <div style="width: 50px;"></div>
        </header>

        <nav>
            <button id="btnWords" class="active" onclick="switchView('viewWords')">단어장</button>
            <button id="btnFullText" onclick="switchView('viewFullText')">전체본문</button>
            <button id="btnSentence" onclick="switchView('viewSentence')">문장학습</button>
        </nav>

        <!-- 1. 단어장 (세로 1열) -->
        <div id="viewWords" class="view-panel active">
            <div id="wordGrid"></div>
        </div>

        <!-- 2. 전체 본문 -->
        <div id="viewFullText" class="view-panel">
            <div class="passage-box" id="fullPassageText"></div>
            <button class="btn-action" onclick="speakAll()">🔊 전체 오디오 듣기</button>
        </div>

        <!-- 3. 한 문장씩 읽기 -->
        <div id="viewSentence" class="view-panel">
            <div style="text-align: right; font-size: 12px; color: #94a3b8; margin-bottom: 6px;" id="sentenceCounter">1 / 1</div>
            <div class="sentence-box">
                <div class="eng-text" id="engSentence"></div>
                <div class="kor-text" id="korSentence"></div>
            </div>
            <div class="sentence-controls">
                <button class="btn-action" style="background: #0284c7;" onclick="speakCurrentSentence()">🔊 읽기 / 해석</button>
                <button class="btn-action" onclick="nextSentence()">다음 문장 ❯</button>
            </div>
        </div>
    </div>

    <script>
        // 지문 기반 핵심 단어 16개 (세로 정렬용)
        const wordList = [
            { eng: "1. encouraging", kor: "격려하는, 용기를 북돋우는" },
            { eng: "2. encouragement", kor: "격려, 응원" },
            { eng: "3. walk", kor: "걷다" },
            { eng: "4. probably", kor: "아마도" },
            { eng: "5. easier", kor: "더 쉬운" },
            { eng: "6. no matter how", kor: "아무리 ~할지라도" },
            { eng: "7. treat", kor: "대하다, 대우하다" },
            { eng: "8. stay", kor: "머무르다, ~한 상태를 유지하다" },
            { eng: "9. ought to", kor: "~해야 한다, ~이어야 한다" },
            { eng: "10. become", kor: "~이 되다" },
            { eng: "11. bigger", kor: "더 큰, 더 넓은 인품의" },
            { eng: "12. better", kor: "더 나은" },
            { eng: "13. right", kor: "옳은, 맞아서" },
            { eng: "14. little", kor: "작은, 약간의" },
            { eng: "15. person", kor: "사람" },
            { eng: "16. learn", kor: "배우다, 습득하다" }
        ];

        // 전체 본문
        const rawPassage = `When you were very small and learning to walk, everyone around you was very encouraging. They probably said things like "Come on! You can do it!" With all that encouragement from others, learning to walk was much easier. No matter how old we are, we all need encouragement from those around us. We need to be encouraged to be the best we can be. Goethe said, "If you treat a man as he is, he will stay as he is; but, if you treat him as if he is what he ought to be, and could be, he will become that bigger and better man." If Goethe is right, we can all be bigger and better people with a little encouragement.`;

        // 문장별 분할 및 한국어 해석
        const sentenceList = [
            { eng: "When you were very small and learning to walk, everyone around you was very encouraging.", kor: "당신이 아주 어리고 걸음마를 배울 때, 주변의 모든 이들은 매우 격려해 주었습니다." },
            { eng: "They probably said things like \"Come on! You can do it!\"", kor: "그들은 아마도 \"자! 넌 할 수 있어!\"와 같은 말을 했을 것입니다." },
            { eng: "With all that encouragement from others, learning to walk was much easier.", kor: "다른 사람들로부터 받은 그 모든 격려 덕분에, 걷기를 배우는 것은 훨씬 더 쉬웠습니다." },
            { eng: "No matter how old we are, we all need encouragement from those around us.", kor: "우리가 몇 살이든 간에, 우리 모두는 주변 사람들의 격려가 필요합니다." },
            { eng: "We need to be encouraged to be the best we can be.", kor: "우리는 우리가 될 수 있는 최선의 모습이 되도록 격려받을 필요가 있습니다." },
            { eng: "Goethe said, \"If you treat a man as he is, he will stay as he is; but, if you treat him as if he is what he ought to be, and could be, he will become that bigger and better man.\"", kor: "괴테는 \"어떤 사람을 현재 있는 그대로 대하면 그는 현재 모습 그대로 남아있을 것이다. 그러나 그가 마땅히 되어야 하고 될 수 있는 모습대로 대해주면, 그는 더 크고 더 나은 사람이 될 것이다.\"라고 말했습니다." },
            { eng: "If Goethe is right, we can all be bigger and better people with a little encouragement.", kor: "괴테의 말이 맞다면, 우리 모두는 약간의 격려만으로도 더 크고 더 나은 사람이 될 수 있습니다." }
        ];

        let currentSentenceIdx = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initWords();
            document.getElementById('fullPassageText').innerText = rawPassage;
        });

        function initWords() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            wordList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerText = item.eng;
                card.dataset.eng = item.eng;
                card.dataset.kor = item.kor;
                card.dataset.state = 'eng';
                
                card.onclick = () => toggleWord(card);
                grid.appendChild(card);
            });
        }

        function toggleWord(card) {
            if (card.dataset.state === 'eng') {
                card.innerText = card.dataset.kor;
                card.classList.add('meaning');
                card.dataset.state = 'kor';
            } else {
                card.innerText = card.dataset.eng;
                card.classList.remove('meaning');
                card.dataset.state = 'eng';
            }
            speak(card.dataset.eng.replace(/^[0-9]+\.\s*/, ''));
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        function speakAll() { speak(rawPassage); }

        function showSentence() {
            const current = sentenceList[currentSentenceIdx];
            document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${sentenceList.length}`;
            document.getElementById('engSentence').innerText = current.eng;
            document.getElementById('korSentence').innerText = current.kor;
            document.getElementById('korSentence').classList.remove('show');
        }

        function speakCurrentSentence() {
            speak(sentenceList[currentSentenceIdx].eng);
            document.getElementById('korSentence').classList.add('show');
        }

        function nextSentence() {
            if (currentSentenceIdx < sentenceList.length - 1) {
                currentSentenceIdx++;
            } else {
                alert("마지막 문장입니다. 첫 문장으로 이동합니다.");
                currentSentenceIdx = 0;
            }
            showSentence();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');

            if (viewId === 'viewWords') document.getElementById('btnWords').classList.add('active');
            if (viewId === 'viewFullText') document.getElementById('btnFullText').classList.add('active');
            if (viewId === 'viewSentence') {
                document.getElementById('btnSentence').classList.add('active');
                currentSentenceIdx = 0;
                showSentence();
            }
        }

        function handleBack() {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
