<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5강 학습하기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        h1 { font-size: 18px; font-weight: 700; }
        
        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        nav button {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        nav button.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
        }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* 단어 16개 세로 1열 정렬 */
        #wordGrid {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px;
            width: 100%;
        }
        .word-card {
            width: 100%;
            padding: 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .word-card.meaning {
            background: #2563eb;
        }

        .passage-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 16px;
            white-space: pre-line;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .sentence-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        .eng-text { font-size: 17px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
        .kor-text { font-size: 14px; color: #94a3b8; display: none; }
        .kor-text.show { display: block; }
        .sentence-controls { display: flex; gap: 8px; }
        .sentence-controls button { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="handleBack()">❮ 메인으로</button>
            <h1 id="mainTitle">5강 학습</h1>
            <div style="width: 50px;"></div>
        </header>

        <nav>
            <button id="btnWords" class="active" onclick="switchView('viewWords')">단어장</button>
            <button id="btnFullText" onclick="switchView('viewFullText')">전체본문</button>
            <button id="btnSentence" onclick="switchView('viewSentence')">문장학습</button>
        </nav>

        <!-- 1. 단어장 (세로 1열) -->
        <div id="viewWords" class="view-panel active">
            <div id="wordGrid"></div>
        </div>

        <!-- 2. 전체 본문 -->
        <div id="viewFullText" class="view-panel">
            <div class="passage-box" id="fullPassageText"></div>
            <button class="btn-action" onclick="speakAll()">🔊 전체 오디오 듣기</button>
        </div>

        <!-- 3. 한 문장씩 읽기 -->
        <div id="viewSentence" class="view-panel">
            <div style="text-align: right; font-size: 12px; color: #94a3b8; margin-bottom: 6px;" id="sentenceCounter">1 / 1</div>
            <div class="sentence-box">
                <div class="eng-text" id="engSentence"></div>
                <div class="kor-text" id="korSentence"></div>
            </div>
            <div class="sentence-controls">
                <button class="btn-action" style="background: #0284c7;" onclick="speakCurrentSentence()">🔊 읽기 / 해석</button>
                <button class="btn-action" onclick="nextSentence()">다음 문장 ❯</button>
            </div>
        </div>
    </div>

    <script>
        // 지문 기반 핵심 단어 16개 (세로 정렬용)
        const wordList = [
            { eng: "1. Roman", kor: "로마인" },
            { eng: "2. honor", kor: "존경, 존중, 영예" },
            { eng: "3. nation", kor: "국가, 민족" },
            { eng: "4. ancient", kor: "고대의" },
            { eng: "5. law", kor: "법, 법률" },
            { eng: "6. freedom", kor: "자유" },
            { eng: "7. marriage", kor: "결혼" },
            { eng: "8. entirely", kor: "전적으로, 완전히" },
            { eng: "9. position", kor: "지위, 위치" },
            { eng: "10. remain", kor: "남다, ~한 상태로 있다" },
            { eng: "11. control", kor: "통제, 지배" },
            { eng: "12. relative", kor: "친척" },
            { eng: "13. legally", kor: "법적으로" },
            { eng: "14. slave", kor: "노예" },
            { eng: "15. mistress", kor: "여주인" },
            { eng: "16. master", kor: "주인" }
        ];

        // 전체 본문
        const rawPassage = `The Romans held women in greater honor than any other nation of the ancient world. However, in the eyes of the Roman law a woman had no freedom. Before her marriage she was entirely in the hands of her father. At the time of her marriage she passed into a similar position towards her husband. And if she remained unmarried, she was under the control of her nearest male relative. Nevertheless, though legally she may have seemed to be little better than a slave, her position in the family was an honored one. A Roman wife was as much the mistress of her house as her husband was its master.`;

        // 문장별 분할 및 한국어 해석
        const sentenceList = [
            { eng: "The Romans held women in greater honor than any other nation of the ancient world.", kor: "로마인들은 고대 세계의 어떤 다른 민족보다도 여성을 크게 존중했습니다." },
            { eng: "However, in the eyes of the Roman law a woman had no freedom.", kor: "하지만 로마법의 관점에서 여성에게는 자유가 없었습니다." },
            { eng: "Before her marriage she was entirely in the hands of her father.", kor: "결혼하기 전 여성은 전적으로 아버지의 손에 달려 있었습니다." },
            { eng: "At the time of her marriage she passed into a similar position towards her husband.", kor: "결혼할 때 그녀는 남편에 대해 비슷한 지위로 넘어갔습니다." },
            { eng: "And if she remained unmarried, she was under the control of her nearest male relative.", kor: "그리고 미혼 상태로 남아있다면 가장 가까운 남성 친척의 통제 아래 있었습니다." },
            { eng: "Nevertheless, though legally she may have seemed to be little better than a slave, her position in the family was an honored one.", kor: "그럼에도 불구하고, 법적으로는 노예보다 겨우 조금 나은 것처럼 보였을지 모르지만, 가정 내에서의 그녀의 지위는 존중받는 자리였습니다." },
            { eng: "A Roman wife was as much the mistress of her house as her husband was its master.", kor: "로마의 아내는 남편이 그 집의 주인인 것만큼이나 자기 집의 여주인이었습니다." }
        ];

        let currentSentenceIdx = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initWords();
            document.getElementById('fullPassageText').innerText = rawPassage;
        });

        function initWords() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            wordList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerText = item.eng;
                card.dataset.eng = item.eng;
                card.dataset.kor = item.kor;
                card.dataset.state = 'eng';
                
                card.onclick = () => toggleWord(card);
                grid.appendChild(card);
            });
        }

        function toggleWord(card) {
            if (card.dataset.state === 'eng') {
                card.innerText = card.dataset.kor;
                card.classList.add('meaning');
                card.dataset.state = 'kor';
            } else {
                card.innerText = card.dataset.eng;
                card.classList.remove('meaning');
                card.dataset.state = 'eng';
            }
            speak(card.dataset.eng.replace(/^[0-9]+\.\s*/, ''));
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        function speakAll() { speak(rawPassage); }

        function showSentence() {
            const current = sentenceList[currentSentenceIdx];
            document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${sentenceList.length}`;
            document.getElementById('engSentence').innerText = current.eng;
            document.getElementById('korSentence').innerText = current.kor;
            document.getElementById('korSentence').classList.remove('show');
        }

        function speakCurrentSentence() {
            speak(sentenceList[currentSentenceIdx].eng);
            document.getElementById('korSentence').classList.add('show');
        }

        function nextSentence() {
            if (currentSentenceIdx < sentenceList.length - 1) {
                currentSentenceIdx++;
            } else {
                alert("마지막 문장입니다. 첫 문장으로 이동합니다.");
                currentSentenceIdx = 0;
            }
            showSentence();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');

            if (viewId === 'viewWords') document.getElementById('btnWords').classList.add('active');
            if (viewId === 'viewFullText') document.getElementById('btnFullText').classList.add('active');
            if (viewId === 'viewSentence') {
                document.getElementById('btnSentence').classList.add('active');
                currentSentenceIdx = 0;
                showSentence();
            }
        }

        function handleBack() {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
