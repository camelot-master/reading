<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11강 학습하기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        h1 { font-size: 18px; font-weight: 700; }
        
        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        nav button {
            flex: 1;
            padding: 10px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        nav button.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
        }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* 단어 16개 세로 1열 정렬 */
        #wordGrid {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px;
            width: 100%;
        }
        .word-card {
            width: 100%;
            padding: 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .word-card.meaning {
            background: #2563eb;
        }

        .passage-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 16px;
            white-space: pre-line;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .sentence-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        .eng-text { font-size: 17px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
        .kor-text { font-size: 14px; color: #94a3b8; display: none; }
        .kor-text.show { display: block; }
        .sentence-controls { display: flex; gap: 8px; }
        .sentence-controls button { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="handleBack()">❮ 메인으로</button>
            <h1 id="mainTitle">11강 학습</h1>
            <div style="width: 50px;"></div>
        </header>

        <nav>
            <button id="btnWords" class="active" onclick="switchView('viewWords')">단어장</button>
            <button id="btnFullText" onclick="switchView('viewFullText')">전체본문</button>
            <button id="btnSentence" onclick="switchView('viewSentence')">문장학습</button>
        </nav>

        <!-- 1. 단어장 (세로 1열) -->
        <div id="viewWords" class="view-panel active">
            <div id="wordGrid"></div>
        </div>

        <!-- 2. 전체 본문 -->
        <div id="viewFullText" class="view-panel">
            <div class="passage-box" id="fullPassageText"></div>
            <button class="btn-action" onclick="speakAll()">🔊 전체 오디오 듣기</button>
        </div>

        <!-- 3. 한 문장씩 읽기 -->
        <div id="viewSentence" class="view-panel">
            <div style="text-align: right; font-size: 12px; color: #94a3b8; margin-bottom: 6px;" id="sentenceCounter">1 / 1</div>
            <div class="sentence-box">
                <div class="eng-text" id="engSentence"></div>
                <div class="kor-text" id="korSentence"></div>
            </div>
            <div class="sentence-controls">
                <button class="btn-action" style="background: #0284c7;" onclick="speakCurrentSentence()">🔊 읽기 / 해석</button>
                <button class="btn-action" onclick="nextSentence()">다음 문장 ❯</button>
            </div>
        </div>
    </div>

    <script>
        // 지문 기반 핵심 단어 16개 (세로 정렬용)
        const wordList = [
            { eng: "1. imitation", kor: "모조품, 모방" },
            { eng: "2. spot", kor: "찾아내다, 포착하다" },
            { eng: "3. challenge", kor: "난제, 도전을 요하는 일" },
            { eng: "4. expert", kor: "전문가" },
            { eng: "5. researcher", kor: "연구원, 조사원" },
            { eng: "6. fake", kor: "가짜, 모조품" },
            { eng: "7. imitator", kor: "모방자, 흉내 내는 사람" },
            { eng: "8. master artist", kor: "거장, 거장 화가" },
            { eng: "9. brush stroke", kor: "붓터치, 붓질" },
            { eng: "10. smooth", kor: "매끄러운, 부드러운" },
            { eng: "11. consistent", kor: "일관된, 고른" },
            { eng: "12. roughly", kor: "거칠게, 투박하게" },
            { eng: "13. technique", kor: "기술, 기법" },
            { eng: "14. break down", kor: "~을 분해하다, 분석하다" },
            { eng: "15. capture", kor: "포착하다, 담아내다" },
            { eng: "16. touch", kor: "손길, 터치" }
        ];

        // 전체 본문
        const rawPassage = `To make a lot of money quickly, people sometimes try to sell paintings that are imitations of the real thing. When the copies are done well, spotting them can be a major challenge, even for experts. Now, researchers say they have found a new way to tell the real from the fake. When an imitator tries to copy a master artist, his or her brush strokes would probably be different. A master might have smooth, consistent strokes, while an imitator moves roughly with many starts and stops in their strokes. This newly found technique can break the image of the paintings down and capture the touch of an artist's brush strokes.`;

        // 문장별 분할 및 한국어 해석
        const sentenceList = [
            { eng: "To make a lot of money quickly, people sometimes try to sell paintings that are imitations of the real thing.", kor: "빠르게 많은 돈을 벌기 위해, 사람들은 때때로 진짜의 모조품인 그림을 팔려고 시도합니다." },
            { eng: "When the copies are done well, spotting them can be a major challenge, even for experts.", kor: "모사품이 잘 만들어졌을 때는 전문가들에게조차 그것을 가려내는 것이 큰 난제가 될 수 있습니다." },
            { eng: "Now, researchers say they have found a new way to tell the real from the fake.", kor: "이제 연구자들은 진짜와 가짜를 구별하는 새로운 방법을 찾아냈다고 말합니다." },
            { eng: "When an imitator tries to copy a master artist, his or her brush strokes would probably be different.", kor: "모방자가 거장의 작품을 모사하려고 할 때, 그의 붓터치는 아마도 다를 것입니다." },
            { eng: "A master might have smooth, consistent strokes, while an imitator moves roughly with many starts and stops in their strokes.", kor: "거장은 매끄럽고 일관된 붓질을 하는 반면, 모방자는 붓질에서 많은 시작과 멈춤을 보이며 거칠게 움직입니다." },
            { eng: "This newly found technique can break the image of the paintings down and capture the touch of an artist's brush strokes.", kor: "이 새롭게 발견된 기술은 그림의 이미지를 세분화하여 화가의 붓터치 감각을 포착해 낼 수 있습니다." }
        ];

        let currentSentenceIdx = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initWords();
            document.getElementById('fullPassageText').innerText = rawPassage;
        });

        function initWords() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            wordList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerText = item.eng;
                card.dataset.eng = item.eng;
                card.dataset.kor = item.kor;
                card.dataset.state = 'eng';
                
                card.onclick = () => toggleWord(card);
                grid.appendChild(card);
            });
        }

        function toggleWord(card) {
            if (card.dataset.state === 'eng') {
                card.innerText = card.dataset.kor;
                card.classList.add('meaning');
                card.dataset.state = 'kor';
            } else {
                card.innerText = card.dataset.eng;
                card.classList.remove('meaning');
                card.dataset.state = 'eng';
            }
            speak(card.dataset.eng.replace(/^[0-9]+\.\s*/, ''));
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        function speakAll() { speak(rawPassage); }

        function showSentence() {
            const current = sentenceList[currentSentenceIdx];
            document.getElementById('sentenceCounter').innerText = `${currentSentenceIdx + 1} / ${sentenceList.length}`;
            document.getElementById('engSentence').innerText = current.eng;
            document.getElementById('korSentence').innerText = current.kor;
            document.getElementById('korSentence').classList.remove('show');
        }

        function speakCurrentSentence() {
            speak(sentenceList[currentSentenceIdx].eng);
            document.getElementById('korSentence').classList.add('show');
        }

        function nextSentence() {
            if (currentSentenceIdx < sentenceList.length - 1) {
                currentSentenceIdx++;
            } else {
                alert("마지막 문장입니다. 첫 문장으로 이동합니다.");
                currentSentenceIdx = 0;
            }
            showSentence();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');

            if (viewId === 'viewWords') document.getElementById('btnWords').classList.add('active');
            if (viewId === 'viewFullText') document.getElementById('btnFullText').classList.add('active');
            if (viewId === 'viewSentence') {
                document.getElementById('btnSentence').classList.add('active');
                currentSentenceIdx = 0;
                showSentence();
            }
        }

        function handleBack() {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
